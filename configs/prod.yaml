gcp:
  project_id: "retail-analytics-prod"
  region: "us-central1"

storage:
  bronze_bucket: "retail-bronze-prod"
  quarantine_bucket: "retail-quarantine-prod"

bigquery:
  staging_dataset: "staging"
  marts_dataset: "marts"
  metadata_dataset: "metadata"

sources:
  exchange_rates:
    api_url: "https://openexchangerates.org/api/latest.json"
    api_key_env: "EXCHANGE_RATES_API_KEY"
    schedule: "daily"

  orders_cdc:
    records_per_batch: 1000
    late_arrival_pct: 0.05
    null_injection_pct: 0.02
    duplicate_pct: 0.03
    schedule: "hourly"

  supplier_catalog:
    file_prefix: "supplier_catalog_"
    expected_columns:
      - product_id
      - product_name
      - category
      - subcategory
      - brand
      - supplier_id
      - unit_cost

quality:
  null_rate_threshold: 0.01
  min_daily_orders: 100
  max_revenue_deviation_pct: 0.50
  quarantine_alert_threshold: 50

pipeline:
  max_retries: 3
  retry_delay_seconds: 300
  retry_exponential_backoff: true
  log_level: "INFO"
