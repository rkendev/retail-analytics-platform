gcp:
  project_id: "retail-analytics-dev"
  region: "us-central1"

storage:
  bronze_bucket: "retail-bronze-dev"
  quarantine_bucket: "retail-quarantine-dev"

bigquery:
  staging_dataset: "staging_dev"
  marts_dataset: "marts_dev"
  metadata_dataset: "metadata_dev"

sources:
  exchange_rates:
    api_url: "https://openexchangerates.org/api/latest.json"
    api_key_env: "EXCHANGE_RATES_API_KEY"
    schedule: "daily"

  orders_cdc:
    records_per_batch: 100
    late_arrival_pct: 0.05
    null_injection_pct: 0.02
    duplicate_pct: 0.03
    schedule: "hourly"

  supplier_catalog:
    file_prefix: "supplier_catalog_"
    expected_columns:
      - product_id
      - product_name
      - category
      - subcategory
      - brand
      - supplier_id
      - unit_cost

quality:
  null_rate_threshold: 0.05
  min_daily_orders: 10
  max_revenue_deviation_pct: 0.50
  quarantine_alert_threshold: 10

pipeline:
  max_retries: 1
  retry_delay_seconds: 10
  retry_exponential_backoff: false
  log_level: "DEBUG"
