version: 2

sources:
  - name: raw
    description: "Raw data loaded from bronze layer into BigQuery staging tables"
    database: "{{ target.project }}"
    schema: "{{ target.dataset }}"

    tables:
      - name: raw_orders
        description: "CDC order records from point-of-sale system"
        columns:
          - name: order_id
            description: "Unique order identifier"
          - name: customer_id
            description: "FK to customer"
          - name: product_id
            description: "FK to product"
          - name: quantity
            description: "Number of units ordered"
          - name: unit_price_local
            description: "Price in local currency"
          - name: currency_code
            description: "ISO 4217 3-letter currency code"
          - name: order_date
            description: "When the order was placed"
          - name: store_key
            description: "FK to store location"
          - name: updated_at
            description: "CDC timestamp for incremental extraction"
          - name: cdc_operation
            description: "I=insert, U=update, D=delete"
          - name: pipeline_run_id
            description: "UUID of the pipeline run that loaded this record"

      - name: raw_customers
        description: "Customer dimension records"
        columns:
          - name: customer_id
            description: "Unique customer identifier"
          - name: name
            description: "Full name"
          - name: email
            description: "Email address"
          - name: signup_date
            description: "Account creation date"
          - name: customer_segment
            description: "Bronze/Silver/Gold/Platinum"

      - name: raw_exchange_rates
        description: "Daily exchange rates (currency → USD)"
        columns:
          - name: currency_code
            description: "ISO 4217 3-letter code"
          - name: rate_to_usd
            description: "Conversion rate to USD"
          - name: rate_date
            description: "Date the rate applies to"
          - name: fetched_at
            description: "When the rate was fetched from API"

      - name: raw_supplier_catalog
        description: "Supplier product catalog from CSV drops"
        columns:
          - name: product_id
            description: "Product identifier"
          - name: product_name
            description: "Display name"
          - name: category
            description: "Top-level product category"
          - name: brand
            description: "Brand name"
          - name: supplier_id
            description: "Supplier identifier"
          - name: unit_cost
            description: "Wholesale cost"
