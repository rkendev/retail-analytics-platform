version: 2

models:
  - name: stg_orders
    description: "Cleaned and typed order records. Deduped by order_id (latest updated_at wins)."
    columns:
      - name: order_id
        description: "Unique order identifier from POS system"
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: unit_price_local
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: currency_code
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: store_key
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customer dimension records"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_exchange_rates
    description: "Daily FX rates (currency_code → USD)"
    columns:
      - name: currency_code
        tests:
          - not_null
      - name: rate_to_usd
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: stg_products
    description: "Product dimension derived from order + supplier data"
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_supplier_catalog
    description: "Supplier catalog from CSV file drops"
